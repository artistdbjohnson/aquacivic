<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AquaCivic" />
    <meta name="description" content="Consola municipal de rega inteligente — Faro, LoRaWAN, despiste de roturas." />
    <title>AquaCivic · Consola Municipal de Rega</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root { color-scheme: dark; }
      html, body { min-height: 100%; background: #000; color: #fff; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      .serif { font-family: "Instrument Serif", Georgia, serif; }
      .glass { background: rgba(255,255,255,.03); box-shadow: inset 0 1px 0 rgba(255,255,255,.12); }
      .pulse-ok { background: #3dd68c; box-shadow: 0 0 12px rgba(61,214,140,.55); }
      .pulse-water { background: #4da3ff; box-shadow: 0 0 12px rgba(77,163,255,.55); }
      .pulse-leak { background: #ff4d4d; box-shadow: 0 0 14px rgba(255,77,77,.7); }
      @media (prefers-reduced-motion: reduce) { .animate-pulse { animation: none; } }
    </style>
  </head>
  <body class="min-h-screen">
    <header class="flex flex-wrap items-center justify-between gap-4 px-5 py-4 md:px-8">
      <div class="flex items-center gap-3">
        <span class="grid h-8 w-8 place-items-center rounded-lg border border-white/15 bg-white/5 text-[11px] font-medium">AC</span>
        <div>
          <p class="text-sm font-medium tracking-tight">AquaCivic <span class="serif italic text-white/70">Consola</span></p>
          <p class="text-[11px] uppercase tracking-[0.18em] text-white/40">Faro · Smart irrigation</p>
        </div>
      </div>
      <div id="gate" class="glass flex items-center gap-3 rounded-full px-3 py-1.5 text-[11px] uppercase tracking-[0.16em] text-white/60">
        <span id="dot" class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span>
        <span id="gate-label">Gateway online · LoRaWAN C</span>
      </div>
    </header>
    <main class="mx-auto flex max-w-6xl flex-col gap-4 px-5 pb-16 md:px-8">
      <p class="text-xs text-white/35">Simulador no browser — mesma regra GSSIC: caudal &gt; 120 L/min com eletroválvula fechada. Latência de hardware 1s.</p>
      <div id="banner"></div>
      <section id="grid" class="grid gap-4 md:grid-cols-2 xl:grid-cols-3"></section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
