<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d7e7f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AquaCivic" />
    <meta name="description" content="Municipal smart-irrigation operator console — Faro, LoRaWAN, leak detection." />
    <title>AquaCivic · Consola Municipal de Rega</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet" />
    <style>
      /* Hallmark · pre-emit critique: P4 H4 E4 S4 R4 V4 */
      :root {
        --ink: #f4f8fc;
        --wash: rgba(26, 111, 181, 0.14);
        --paper: rgba(255, 255, 255, 0.72);
        --paper-solid: #ffffff;
        --line: rgba(11, 31, 51, 0.10);
        --line-strong: rgba(11, 31, 51, 0.18);
        --text: #0b1f33;
        --muted: #4a657c;
        --faint: #7a93a8;
        --water: #1a6fb5;
        --water-2: #2b8fd4;
        --leak: #c45a3c;
        --ok: #2a8f6e;
        --frost: blur(18px) saturate(1.25);
        --serif: "Instrument Serif", Georgia, serif;
        --sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--ink);
        color: var(--text);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        overflow-x: clip;
      }
      body {
        background-image:
          radial-gradient(90vw 46vh at 12% -8%, var(--wash), transparent 62%),
          radial-gradient(70vw 36vh at 92% 8%, rgba(43, 143, 212, 0.10), transparent 58%),
          linear-gradient(180deg, #e4eef6 0%, #f4f8fc 38%, #eef5fa 100%);
      }
      button { font: inherit; color: inherit; }
      button:focus-visible, .lang button:focus-visible, .sw:focus-visible {
        outline: 2px solid var(--water);
        outline-offset: 2px;
      }
      .serif { font-family: var(--serif); font-style: normal; }
      .mono { font-family: var(--mono); }
      .wrap {
        width: min(1080px, calc(100% - 32px));
        margin: 0 auto;
      }
      header.top {
        padding: calc(14px + env(safe-area-inset-top)) 0 16px;
        margin-bottom: 18px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.62);
      }
      @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        header.top, .lang, .gate, .card, .banner {
          backdrop-filter: var(--frost);
          -webkit-backdrop-filter: var(--frost);
        }
      }
      .brand-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .mark {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line-strong);
        background: rgba(255, 255, 255, 0.7);
        color: var(--water);
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.04em;
        flex: none;
      }
      .brand-name {
        margin: 0;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: -0.02em;
      }
      .brand-name span {
        margin-left: 6px;
        font-family: var(--serif);
        font-style: normal;
        color: var(--muted);
      }
      .brand-loc {
        margin: 3px 0 0;
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
      }
      .lang, .gate, .card {
        background: var(--paper);
        border: 1px solid var(--line);
        backdrop-filter: var(--frost);
        -webkit-backdrop-filter: var(--frost);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.65) inset, 0 10px 28px rgba(16, 52, 84, 0.06);
      }
      .lang {
        display: flex;
        flex: none;
        overflow: hidden;
      }
      .lang button {
        appearance: none;
        border: 0;
        background: transparent;
        min-width: 40px;
        min-height: 32px;
        padding: 0 11px;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .lang button[aria-pressed="true"] {
        background: rgba(26, 111, 181, 0.12);
        color: var(--text);
      }
      .gate {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 32px;
        padding: 0 11px;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
      }
      .gate-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ok);
        flex: none;
      }
      .sim {
        margin: 0 0 16px;
        max-width: 46em;
        font-size: 12px;
        line-height: 1.45;
        color: var(--faint);
      }
      .banner {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin: 0 0 16px;
        padding: 10px 14px 11px 16px;
        border: 1px solid rgba(196, 90, 60, 0.28);
        border-left: 2px solid var(--leak);
        background: rgba(196, 90, 60, 0.08);
        color: #8a2f1f;
        backdrop-filter: var(--frost);
        -webkit-backdrop-filter: var(--frost);
      }
      .banner strong {
        font-weight: 500;
        font-size: 13px;
      }
      .banner span {
        font-size: 12px;
        color: rgba(138, 47, 31, 0.78);
      }
      .grid {
        display: grid;
        gap: 14px;
        padding-bottom: calc(28px + env(safe-area-inset-bottom));
      }
      @media (min-width: 760px) {
        .grid { grid-template-columns: 1fr 1fr; }
        header.top .wrap {
          display: flex;
          align-items: flex-end;
          justify-content: space-between;
          gap: 16px;
        }
        .toolbar { margin-top: 0; }
      }
      @media (min-width: 1100px) {
        .grid { grid-template-columns: 1fr 1fr 1fr; }
      }
      .card { min-width: 0; }
      .card.is-leak {
        border-color: rgba(196, 90, 60, 0.34);
        border-left: 2px solid var(--leak);
        background: linear-gradient(90deg, rgba(196, 90, 60, 0.10), var(--paper) 32%);
      }
      .card.is-water { border-left: 2px solid var(--water); }
      .card-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 16px 12px;
      }
      .card-head h2 {
        margin: 0;
        font-family: var(--serif);
        font-style: normal;
        font-weight: 400;
        font-size: 22px;
        line-height: 1.15;
        letter-spacing: -0.02em;
        overflow-wrap: anywhere;
      }
      .card-head .id {
        margin: 5px 0 0;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--faint);
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 4px;
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
        white-space: nowrap;
      }
      .status i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ok);
        display: block;
      }
      .status.watering i { background: var(--water); }
      .status.leak i { background: var(--leak); }
      .metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.38);
      }
      .metrics div { padding: 12px 14px 13px; }
      .metrics div + div { border-left: 1px solid var(--line); }
      .metrics dt {
        margin: 0;
        font-size: 9px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .metrics dd {
        margin: 6px 0 0;
        font-variant-numeric: tabular-nums;
        font-size: 20px;
        font-weight: 500;
        letter-spacing: -0.03em;
      }
      .metrics .unit {
        margin-left: 3px;
        font-size: 10px;
        font-weight: 400;
        color: var(--faint);
      }
      .metrics .hot { color: var(--leak); }
      .spark-wrap { padding: 10px 14px 4px; }
      .spark-wrap svg { display: block; width: 100%; height: 44px; }
      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px 14px;
      }
      .foot p { margin: 0; }
      .foot .k {
        font-size: 9px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .foot .v { margin-top: 4px; font-size: 13px; color: var(--text); }
      .foot .phase { margin-top: 4px; font-size: 12px; color: var(--water); }
      .sw {
        appearance: none;
        position: relative;
        width: 48px;
        height: 28px;
        border: 0;
        border-radius: 999px;
        background: #c9d7e3;
        flex: none;
      }
      .sw[aria-pressed="true"] { background: var(--water); }
      .sw:disabled { opacity: 0.5; }
      .sw span {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(11, 31, 51, 0.18);
        transition: transform 0.2s ease;
      }
      .sw[aria-pressed="true"] span { transform: translateX(20px); }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="wrap">
      <div class="brand-row">
        <span class="mark">AC</span>
        <div>
          <p class="brand-name">AquaCivic <span id="brand-sub">Consola</span></p>
          <p id="brand-loc" class="brand-loc">Faro · Smart irrigation</p>
        </div>
      </div>
      <div class="toolbar">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="pt" aria-pressed="true">PT</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <div class="gate" title="Gateway online · LoRaWAN Class C">
          <span class="gate-dot"></span>
          <span id="gate-label">GW · LoRa C</span>
        </div>
      </div>
      </div>
    </header>
    <main class="wrap">
      <p id="sim-note" class="sim">Simulador no browser — mesma regra GSSIC: caudal &gt; 120 L/min com eletroválvula fechada. Latência de hardware 1s.</p>
      <div id="banner"></div>
      <section id="grid" class="grid"></section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
